schema_version: 7.0
type: filter
identifier: vr_mask
title: "VR: Mask"
version: 1
copyright: the vredit authors
license: GPLv2
language: en
tags:
  - Video
description: >
  Per-eye masks for VR clips: field-of-view circle, longitude/latitude window, nadir or zenith cap.
parameters:
  - identifier: packing
    title: Packing
    type: string
    values: [mono, sbs, tb]
    default: sbs
    readonly: no
  - identifier: lon_min
    title: Longitude min
    type: float
    default: -90
    unit: degrees
    readonly: no
  - identifier: lon_max
    title: Longitude max
    type: float
    default: 90
    unit: degrees
    readonly: no
  - identifier: lat_min
    title: Latitude min
    type: float
    default: -90
    unit: degrees
    readonly: no
  - identifier: lat_max
    title: Latitude max
    type: float
    default: 90
    unit: degrees
    readonly: no
  - identifier: swap_eyes
    title: Right eye first
    type: boolean
    default: 0
    readonly: no
  - identifier: mode
    title: Mode
    type: string
    values: [fov, rect, nadir, zenith]
    default: fov
    readonly: no
  - identifier: fov
    title: Field of view
    type: float
    minimum: 10
    maximum: 360
    default: 180
    readonly: no
    mutable: yes
    animation: yes
  - identifier: center_lon
    title: Center longitude
    type: float
    minimum: -180
    maximum: 180
    default: 0
    readonly: no
    mutable: yes
    animation: yes
  - identifier: center_lat
    title: Center latitude
    type: float
    minimum: -90
    maximum: 90
    default: 0
    readonly: no
    mutable: yes
    animation: yes
  - identifier: crop_lon_min
    title: Left edge
    type: float
    minimum: -180
    maximum: 180
    default: -90
    readonly: no
    mutable: yes
    animation: yes
  - identifier: crop_lon_max
    title: Right edge
    type: float
    minimum: -180
    maximum: 180
    default: 90
    readonly: no
    mutable: yes
    animation: yes
  - identifier: crop_lat_min
    title: Bottom edge
    type: float
    minimum: -90
    maximum: 90
    default: -90
    readonly: no
    mutable: yes
    animation: yes
  - identifier: crop_lat_max
    title: Top edge
    type: float
    minimum: -90
    maximum: 90
    default: 90
    readonly: no
    mutable: yes
    animation: yes
  - identifier: cap_radius
    title: Cap radius
    type: float
    minimum: 1
    maximum: 90
    default: 20
    readonly: no
    mutable: yes
    animation: yes
  - identifier: feather
    title: Feather
    type: float
    minimum: 0
    maximum: 45
    default: 5
    readonly: no
    mutable: yes
    animation: yes
  - identifier: color
    title: Fill color
    type: color
    default: "#ff000000"
    readonly: no
