schema_version: 7.0
type: filter
identifier: vr_transform
title: "VR: Transform"
version: 1
copyright: the vredit authors
license: GPLv2
language: en
tags:
  - Video
description: >
  Rotate the view of a VR clip (180 or 360, mono, side-by-side or top-bottom). Every eye gets the same rotation,
  so stereo is kept. Same angle meaning as 360: Transform.
parameters:
  - identifier: packing
    title: Packing
    type: string
    values: [mono, sbs, tb]
    default: sbs
    readonly: no
    mutable: yes
  - identifier: lon_min
    title: Longitude min
    type: float
    default: -90
    unit: degrees
    readonly: no
  - identifier: lon_max
    title: Longitude max
    type: float
    default: 90
    unit: degrees
    readonly: no
  - identifier: lat_min
    title: Latitude min
    type: float
    default: -90
    unit: degrees
    readonly: no
  - identifier: lat_max
    title: Latitude max
    type: float
    default: 90
    unit: degrees
    readonly: no
  - identifier: swap_eyes
    title: Right eye first
    type: boolean
    default: 0
    readonly: no
  - identifier: yaw
    title: Yaw
    type: float
    default: 0
    unit: degrees
    animation: yes
    mutable: yes
    readonly: no
  - identifier: pitch
    title: Pitch
    type: float
    default: 0
    unit: degrees
    animation: yes
    mutable: yes
    readonly: no
  - identifier: roll
    title: Roll
    type: float
    default: 0
    unit: degrees
    animation: yes
    mutable: yes
    readonly: no
